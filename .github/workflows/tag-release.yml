# Release the version in package.json from the Actions tab: tags main's
# commit v<version>, then runs Release (npm) and Binaries on that tag.
#
# A tag pushed with the workflow's own token starts no workflows, so this
# starts them itself; a workflow_dispatch from that token does run. Pushing
# the tag from a clone (git push origin v<version>) still works the same.
name: Tag a release

on:
  workflow_dispatch:

permissions:
  contents: write # push the tag
  actions: write # start Release and Binaries on it

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag v<version> and release it
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Tag the version in package.json
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists; bump the version in package.json first"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "vigent $version" HEAD
          git push origin "$tag"
          echo "tagged $(git rev-parse --short HEAD) as $tag"

      - name: Run Release and Binaries on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh workflow run release.yml --ref "$TAG"
          gh workflow run binaries.yml --ref "$TAG"
          echo "started Release and Binaries on $TAG: https://github.com/${{ github.repository }}/actions"
