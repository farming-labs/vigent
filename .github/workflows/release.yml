# Publish vigent to npm.
#
# Runs on a version tag (v0.1.0, matching package.json) or by hand from the
# Actions tab. Needs the repository secret NPM_TOKEN: an npm token that can
# publish the `vigent` package.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # every registry entry loads with vigent's own code, and the index vigent add reads is up to date
      - name: Check the registry
        run: npm run registry:check

      - name: Check the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          name="$(node -p 'require("./package.json").name')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN" || { echo "add the NPM_TOKEN repository secret first" >&2; exit 1; }
          npm publish --access public
          npm view "${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}" version
