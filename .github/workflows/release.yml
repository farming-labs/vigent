# Publish vigent to npm.
#
# Runs on a version tag (v0.1.0, matching package.json) or by hand from the
# Actions tab. Publishes with npm trusted publishing: npm trusts this workflow
# file (farming-labs/vigent, release.yml) through GitHub's OIDC token, so
# there's no npm token to store or rotate, and npm adds provenance itself.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token npm trusted publishing exchanges

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10
      - name: npm with trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # every registry entry loads with vigent's own code, and the index vigent add reads is up to date
      - name: Check the registry
        run: npm run registry:check

      - name: Check the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          name="$(node -p 'require("./package.json").name')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # npm publish exits 0 only once the registry has the version. Don't
          # npm view it afterwards: the registry can take a minute to serve a
          # new version, and that 404 turned the 0.10.3 release red.
          npm publish --access public || {
            echo "::error::npm refused the publish. Check that ${{ steps.version.outputs.name }} on npmjs.com lists a trusted publisher for GitHub Actions: farming-labs/vigent, workflow release.yml"
            exit 1
          }
